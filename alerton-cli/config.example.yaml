# Per-deployment CLI config. Copy beside the CLI binary as config.yaml
# (or config.local.yaml). Each host can set its own resolve_after_seconds.
#
# api_key MUST match root `.env` → ALERT_INGEST_API_KEY.

url: "http://127.0.0.1:5000/alert"
api_key: "change_me_ingest_api_key"

# Quiet window (seconds). Fingerprints not reasserted for this long
# are POSTed to /alert/resolve (on next send or --flush-resolves).
resolve_after_seconds: 300

# Agent heartbeat interval (seconds). Default 15 minutes.
# Backend marks agent "down" after 2× this (30 min without a beat).
# Run long-lived: node cli.js --agent
heartbeat_interval_seconds: 900

message: "Default alert message"
severity: "minor"
server_name: "cli1-server"
group_name: "techops"
app_name: "monitor"
country_name: "United States"
