services:
  postgres:
    image: postgres:15-alpine
    container_name: longshot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alerton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alert123}
      POSTGRES_DB: ${POSTGRES_DB:-alerton}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - longshot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alerton} -d ${POSTGRES_DB:-alerton}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./alerton-backend
    container_name: longshot-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-alerton}:${POSTGRES_PASSWORD:-alert123}@postgres:5432/${POSTGRES_DB:-alerton}
      JWT_SECRET: ${JWT_SECRET}
      PORT: ${PORT:-5000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ALERT_INGEST_API_KEY: ${ALERT_INGEST_API_KEY}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./alerton-frontend
    container_name: longshot-frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5000}
      WDS_SOCKET_PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  longshot_pgdata:
